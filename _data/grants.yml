# Projekty (strona /projekty/).
# current – projekty w trakcie realizacji (images – zdjęcia z assets/img/projects/, funding_logos/banner – oznaczenie finansowania);
# equipment – zdjęcia sprzętu pod wstępem; rector – Granty Rektora AGH wg edycji (najnowsze na górze)

current:
  - title: ICUAS UAV Competition
    text: >-
      Projekt realizowany z myślą o corocznych zawodach odbywających się w ramach międzynarodowej konferencji ICUAS.
      Rozwijamy w nim autonomiczny system zarządzania i pozycjonowania roju BSP, przeznaczony do misji poszukiwawczych
      w środowisku miejskim.
    images: [icuas3.png, icuas1.png]
  - title: SKNTI AEROSENSE
    subtitle: "AEROSENSE: Autonomiczny BSP do zintegrowanego monitoringu środowiska wodnego i lądowego"
    text: >-
      W ramach grantu Ministra Nauki i Szkolnictwa Wyższego („Studenckie koła naukowe tworzą innowacje”) projektujemy
      i programujemy drona do zaawansowanych badań środowiska. Częścią projektu jest start w zawodach Droniada –
      konstruujemy system do samodzielnego poboru i badania parametrów wody metodą in-situ.
    funding: Projekt finansowany ze środków budżetu państwa, przyznanych przez Ministra Nauki i Szkolnictwa Wyższego w ramach Programu „Studenckie koła naukowe tworzą innowacje”.
    images: [hydrolab1.png]
    funding_logos: [mnsiw.jpg, sknti.svg]
    banner: aerosense_baner.jpg

